# Builds sigit for Windows and macOS and publishes them as a GitHub release.
# (Linux builds from source: see the README.)
# Runs when a version tag is pushed (git tag v0.1.0 && git push origin v0.1.0), or by hand
# (Actions → Release → Run workflow), which builds without publishing.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: sigit-windows-x64.zip
          - name: macOS Apple Silicon
            os: macos-latest
            target: aarch64-apple-darwin
            asset: sigit-macos-arm64.zip
          - name: macOS Intel
            os: macos-latest
            target: x86_64-apple-darwin
            asset: sigit-macos-x64.zip
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml picks the Rust version; rustup installs it on first use.
      - name: Rust target
        shell: bash
        run: rustup target add ${{ matrix.target }}

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.target }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: ${{ matrix.target }}-

      - name: Build
        shell: bash
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist/sigit | Out-Null
          Copy-Item target/${{ matrix.target }}/release/sigit.exe, README.md, LICENSE dist/sigit/
          Compress-Archive -Path dist/sigit/* -DestinationPath dist/${{ matrix.asset }}

      - name: Installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          if ($version -notmatch '^[0-9]') { $version = '0.0.0' }
          $exe = (Resolve-Path target/${{ matrix.target }}/release/sigit.exe).Path
          & $iscc /Q "/DAppVersion=$version" "/DSourceExe=$exe" "/O$((Resolve-Path dist).Path)" installer/windows/sigit.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem dist/sigit-setup-*.exe

      - name: Package (macOS app)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          case "$version" in [0-9]*) ;; *) version="0.0.0" ;; esac
          app=dist/sigit.app
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          cp target/${{ matrix.target }}/release/sigit "$app/Contents/MacOS/sigit"
          cp assets/icon.icns "$app/Contents/Resources/sigit.icns"
          cat > "$app/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleName</key><string>sigit</string>
            <key>CFBundleDisplayName</key><string>sigit</string>
            <key>CFBundleIdentifier</key><string>dev.sigit.app</string>
            <key>CFBundleExecutable</key><string>sigit</string>
            <key>CFBundleIconFile</key><string>sigit</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>$version</string>
            <key>CFBundleVersion</key><string>$version</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict></plist>
          PLIST
          # Ad-hoc signature: required to run on Apple Silicon. Not notarized (see README).
          codesign --force --deep --sign - "$app"
          cp README.md LICENSE dist/
          (cd dist && ditto -c -k --keepParent sigit.app ${{ matrix.asset }} && zip -q ${{ matrix.asset }} README.md LICENSE)

      - name: Installer (macOS disk image)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          # Open it, drag sigit into Applications.
          mkdir -p dist/dmg
          cp -R dist/sigit.app dist/dmg/
          ln -s /Applications dist/dmg/Applications
          asset="${{ matrix.asset }}"
          hdiutil create -volname sigit -srcfolder dist/dmg -fs HFS+ -format UDZO -ov "dist/${asset%.zip}.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          # The zip, plus the installer (sigit-setup-*.exe or *.dmg).
          path: |
            dist/sigit-*.zip
            dist/sigit-*.exe
            dist/sigit-*.dmg
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "sigit $GITHUB_REF_NAME" \
            --generate-notes
