[package]
name = "sigit"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A fast desktop UI for everyday git and GitHub work (PRs, Actions, environments, commit graph) on the Rune GPU UI framework."
readme = "README.md"
# Also where "Check for updates" looks for new releases (src/update.rs).
repository = "https://github.com/moonmangit/sigit"
keywords = ["github", "git", "desktop", "pull-requests", "gui"]
categories = ["development-tools"]
# Rune comes from git, which crates.io doesn't allow: released as a binary, not a crate.
publish = false

[dependencies]
# Rune is pre-release and not on crates.io: every Rune crate comes from its git repository,
# pinned to one commit of its `dev` branch so builds are reproducible. To move to a newer Rune,
# change the `rev` in all eight places below (and check its CHANGELOG.md).
# `native-file-dialog`: the OS Open File / Open Folder dialogs (rfd on Windows and macOS).
# `segmenter-dictionaries`: correct line breaks in PR titles and notifications written in
# scripts without spaces between words (Thai, Lao, Khmer, Burmese, Chinese, Japanese).
rune = { git = "https://github.com/anomalyco/rune", rev = "165f87a4700a5515b03d4de04876aa2e64a30c21", features = ["native-file-dialog", "segmenter-dictionaries"] }
# `markdown`: PR descriptions render as GitHub-flavoured Markdown.
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "165f87a4700a5515b03d4de04876aa2e64a30c21", features = ["markdown"] }
# Bundled fonts (Inter + IBM Plex Mono), so code, SHAs and diffs line up.
rune-theme-opencode = { git = "https://github.com/anomalyco/rune", rev = "165f87a4700a5515b03d4de04876aa2e64a30c21" }
# Windows toast / macOS notifications for watched runs and PRs.
rune-notify = { git = "https://github.com/anomalyco/rune", rev = "165f87a4700a5515b03d4de04876aa2e64a30c21" }
# `gh` and `git` print JSON / delimited text; serde turns it into typed rows.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Local time zone for "today" / "this week" and per-day buckets on the Activity page.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

# Rune builds against patched copies of these four crates, kept in Rune's repository. A
# dependency's [patch] does not carry over to the app that depends on it, so every Rune app
# repeats them, at the same commit (Rune's Cargo.toml says what each patch changes).
[patch.crates-io]
wgpu-hal = { git = "https://github.com/anomalyco/rune", rev = "165f87a4700a5515b03d4de04876aa2e64a30c21" }
winit = { git = "https://github.com/anomalyco/rune", rev = "165f87a4700a5515b03d4de04876aa2e64a30c21" }
parley_engine = { git = "https://github.com/anomalyco/rune", rev = "165f87a4700a5515b03d4de04876aa2e64a30c21" }
accesskit_windows = { git = "https://github.com/anomalyco/rune", rev = "165f87a4700a5515b03d4de04876aa2e64a30c21" }

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
opt-level = 1
